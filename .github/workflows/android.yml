name: Android CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests & build
        shell: bash
        run: |
          set -o pipefail
          gradle testDebugUnitTest assembleDebug assembleRelease bundleRelease --no-daemon --stacktrace --continue 2>&1 | tee ci-build.log

      - name: Diagnostics
        if: always()
        shell: bash
        run: |
          echo "=== APK файлове ==="
          find . -name "*.apk" -not -path "./.git/*" || true
          echo "=== Успешни задачи ==="
          grep -E "^> Task|BUILD (SUCCESSFUL|FAILED)|^e: |^w: " ci-build.log | tail -n 60 || true
          echo "=== Последни редове ==="
          tail -n 150 ci-build.log || true

      - name: Verify APK (подписи v1/v2/v3 + badging)
        if: always()
        shell: bash
        run: |
          set +e
          REL=app/build/outputs/apk/release/app-release.apk
          DBG=app/build/outputs/apk/debug/app-debug.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* 2>/dev/null | sort -V | tail -1)
          APKSIGNER="$BT/apksigner"
          AAPT2="$BT/aapt2"
          {
            echo "===== Генерирани APK файлове ====="
            ls -la app/build/outputs/apk/release/ app/build/outputs/apk/debug/ 2>&1
            echo
            echo "===== RELEASE: apksigner verify (схеми v1/v2/v3) ====="
            "$APKSIGNER" verify --verbose --print-certs "$REL" 2>&1
            echo
            echo "===== RELEASE: aapt2 dump badging ====="
            "$AAPT2" dump badging "$REL" 2>&1 | grep -E "^package:|^sdkVersion|^targetSdkVersion|^launchable-activity|application-debuggable|testOnly"
            echo
            echo "===== RELEASE: версии в манифеста ====="
            "$AAPT2" dump badging "$REL" 2>&1 | grep -E "versionCode|versionName|minSdkVersion|targetSdkVersion"
            echo
            echo "===== DEBUG: apksigner verify (схеми v1/v2/v3) ====="
            "$APKSIGNER" verify --verbose --print-certs "$DBG" 2>&1
            echo "===== КРАЙ ====="
          } > docs/apk-info.txt 2>&1
          echo "----- docs/apk-info.txt -----"
          cat docs/apk-info.txt || true
          exit 0

      - name: Rename APK
        if: success()
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/release/app-release.apk artifacts/EmotionPet.apk
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/EmotionPet-debug.apk
          cp app/build/outputs/bundle/release/app-release.aab artifacts/EmotionPet.aab
          ls -la artifacts/

      - name: Upload UI screenshots
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: docs/screenshots
          if-no-files-found: ignore

      # APK-то се commit-ва директно в repo-то, за да може да се свали
      # от raw.githubusercontent.com (без пренасочване към release CDN,
      # който понякога се блокира/къса на телефона).
      - name: Commit APK + снимки в repo-то
        if: success() && github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f docs/screenshots
          git add -f docs/apk-info.txt
          git add -f artifacts/EmotionPet.apk
          git commit -m "ci: обнови снимките + APK за директно сваляне [skip ci]" || exit 0
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || exit 0
          git push || exit 0

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: EmotionPet-apks
          path: |
            artifacts/EmotionPet.apk
            artifacts/EmotionPet-debug.apk
            artifacts/EmotionPet.aab
          if-no-files-found: error

      - name: Publish "latest build" release
        if: |
          success() && (
            github.event_name == 'workflow_dispatch' ||
            github.ref == 'refs/heads/main' ||
            startsWith(github.ref, 'refs/tags/v')
          )
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'latest-build' }}
          make_latest: false
          name: Emotion Pet — latest build
          prerelease: true
          body: |
            Автоматично компилиран APK от commit ${{ github.sha }}.
            • EmotionPet.apk — инсталация директно на телефона (release, подписан)
            • EmotionPet.aab — Android App Bundle за качване в Google Play
          files: |
            artifacts/EmotionPet.apk
            artifacts/EmotionPet.aab

      # Мрежата в sandbox-а не стига до логовете на Actions, затова при грешка
      # логът се записва в самото репо, за да може да се прочете.
      - name: Publish build log on failure
        if: failure()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f ci-build.log
          git commit -m "ci: build log [skip ci]" || exit 0
          git push || exit 0
